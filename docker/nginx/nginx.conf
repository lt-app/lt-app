user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    server_tokens       off;

    # 后端 multipart 上传上限为 50MB，这里留出余量
    client_max_body_size 60m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/xml+rss image/svg+xml
               font/woff font/woff2;

    # Docker 内置 DNS：通过变量引用 upstream 时由运行期解析，
    # 后端容器重启换 IP 后 nginx 不会缓存旧地址导致 502
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen       80;
        server_name  _;

        # 根路径进管理端；两个前端都用相对资源路径，必须带尾斜杠，否则 ./assets 会解析到根
        location = / {
            return 301 /ltapp/;
        }
        location = /ltapp { return 301 /ltapp/; }
        location = /mall  { return 301 /mall/; }

        # ---- app-designer 管理端：/ltapp/ ----
        location /ltapp/ {
            root   /usr/share/nginx;
            index  index.html;
            # 两个前端都是 hash 路由，这里主要兜住刷新时的非资源路径
            try_files $uri $uri/ /ltapp/index.html;
        }

        # ---- app-mall 商城：/mall/ ----
        location /mall/ {
            root   /usr/share/nginx;
            index  index.html;
            try_files $uri $uri/ /mall/index.html;
        }

        # 带内容哈希的构建产物可以长缓存
        location /ltapp/assets/ {
            root   /usr/share/nginx;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        location /mall/assets/ {
            root   /usr/share/nginx;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ---- 后端 API 反代 ----
        # 后端 context-path 为 /lt-app/api/v1，/lt-app/ 前缀整体透传
        location /lt-app/ {
            # 用变量引用，配合上面的 resolver 运行期解析
            set $lt_app_upstream http://lt-app-backend:8088;
            proxy_pass $lt_app_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-Host  $host;

            # WebSocket / SSE / 流式响应（如 TTS 音频流）不缓冲
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
        }
    }

    # WebSocket 连接升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
